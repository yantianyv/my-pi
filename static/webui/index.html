<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pi WebUI</title>
<style>
/* ============================================================
 * pi WebUI — 现代深色主题：荧光绿身份 + 玻璃拟态层次
 * 布局：header（会话/模型/thinking + 状态徽章弹浮层）· 居中限宽聊天流 · 精致 composer
 * ============================================================ */
:root {
  --bg: #0c100e;                    /* 稍亮、绿色偏移减弱 */
  --bg-glow: rgba(0, 230, 118, 0.04);
  --surface: #141b17;
  --surface-2: #101713;
  --surface-3: #0d130f;
  --border: #25352c;
  --border-soft: #1e2b24;
  --text: #e5eee9;                  /* 主文字调亮 */
  --text-2: #acc4b5;                /* 次要文字调亮 */
  --text-dim: #88a696;              /* 明显调亮（原 #6d8b7a 太暗费眼） */
  --text-faint: #6b8273;            /* 明显调亮（原 #4d6758） */
  --accent: #00e676;
  --accent-strong: #2ff09a;
  --accent-dim: rgba(0, 230, 118, 0.10);
  --accent-border: rgba(0, 230, 118, 0.32);
  --danger: #ff6b6b;
  --danger-dim: rgba(255, 107, 107, 0.10);
  --warn: #ffb940;
  --info: #79b8ff;
  --radius: 12px;
  --radius-sm: 8px;
  --mono: "Cascadia Code", "JetBrains Mono", "SF Mono", Consolas, monospace;
  --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  --chat-max: 780px;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--sans);
  height: 100vh; overflow: hidden; font-size: 14.5px;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
/* 背景氛围光（顶部绿色微光） */
body::before {
  content: ""; position: fixed; inset: 0 0 auto 0; height: 320px; pointer-events: none;
  background: radial-gradient(ellipse 60% 100% at 50% -20%, var(--bg-glow), transparent 70%);
  z-index: 0;
}

/* ===== 布局骨架 ===== */
#app { display: flex; height: 100vh; position: relative; z-index: 1; }
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ===== 顶栏 ===== */
#header {
  display: flex; align-items: center; gap: 14px; padding: 0 20px; height: 52px;
  border-bottom: 1px solid var(--border-soft);
  background: color-mix(in srgb, var(--surface) 72%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  flex-shrink: 0;
}
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--mono); font-weight: 700; font-size: 15px; letter-spacing: .5px; }
.brand .logo {
  width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), #009c4e);
  color: #04210f; font-size: 14px; box-shadow: 0 0 14px rgba(0, 230, 118, 0.35);
}
#session-name { color: var(--text-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 30vw; }
.hdr-sep { width: 1px; height: 18px; background: var(--border); }
#back-list { color: var(--text-dim); font-size: 11.5px; text-decoration: none; font-family: var(--mono); }
#back-list:hover { color: var(--accent); }
.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.pill {
  display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px;
  border: 1px solid var(--border); border-radius: 999px; font-size: 12px; font-family: var(--mono);
  color: var(--text-2); background: var(--surface-2); cursor: pointer; user-select: none;
  transition: border-color .15s, color .15s, background .15s; white-space: nowrap;
}
.pill:hover { border-color: var(--accent-border); color: var(--accent); }
.pill .k { color: var(--text-faint); }
.pill.conn-ok { border-color: var(--accent-border); }
.pill.conn-ok .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.pill.conn-busy { border-color: rgba(255, 179, 0, .4); }
.pill.conn-busy .dot { background: var(--warn); animation: pulse 1s infinite; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); }
@keyframes pulse { 50% { opacity: .3; } }
#conn-text { color: var(--text-dim); font-size: 11.5px; font-family: var(--mono); }

/* ===== 聊天流 ===== */
#chat-wrap { flex: 1; overflow: hidden; position: relative; }
#chat {
  height: 100%; overflow-y: auto; padding: 30px 24px 44px;
  display: flex; flex-direction: column; gap: 4px;
  scroll-behavior: smooth;
}
#chat::-webkit-scrollbar { width: 9px; }
#chat::-webkit-scrollbar-thumb { background: #1c2b23; border-radius: 5px; border: 2px solid var(--bg); }
#chat::-webkit-scrollbar-thumb:hover { background: #2a4234; }
#chat::-webkit-scrollbar-track { background: transparent; }

.chat-inner { width: 100%; max-width: var(--chat-max); margin: 0 auto; display: flex; flex-direction: column; gap: 2px; }

/* 消息 */
.msg { display: flex; flex-direction: column; animation: rise .22s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.msg.user { align-items: flex-end; margin: 10px 0 14px; }
.msg.assistant { align-items: stretch; margin: 6px 0 16px; }
.msg .meta {
  font-size: 10.5px; color: var(--text-faint); font-family: var(--mono);
  letter-spacing: .3px;
}
.msg .body {
  font-size: 15px; line-height: 1.78; overflow-wrap: break-word; color: var(--text);
}
.msg.user .body {
  background: linear-gradient(135deg, #0c8f4e, #06a05a);
  color: #eafff2; padding: 10px 15px; border-radius: 16px 16px 4px 16px;
  box-shadow: 0 4px 18px rgba(0, 160, 90, 0.18); max-width: 78%;
}
.msg.assistant .body { max-width: 100%; }
.msg.assistant.streaming .body::after {
  content: "▊"; color: var(--accent); animation: blink .85s steps(1) infinite; margin-left: 2px;
}
@keyframes blink { 50% { opacity: 0; } }

/* 思考折叠 */
details.thinking {
  margin: 8px 0 10px; border: 1px solid var(--border-soft); border-left: 3px solid var(--accent-dim);
  border-radius: var(--radius-sm); background: var(--surface-2); overflow: hidden;
  font-size: 13px;
}
details.thinking summary {
  cursor: pointer; padding: 7px 12px; color: var(--text-dim); font-family: var(--mono);
  font-size: 11.5px; letter-spacing: .4px; user-select: none; list-style: none;
  display: flex; align-items: center; gap: 7px;
}
details.thinking summary::before { content: "思考过程"; color: var(--text-dim); }
details.thinking.active summary::before { content: "思考中…"; color: var(--accent); animation: pulse 1.2s infinite; }
details.thinking summary::after { content: "▸"; margin-left: auto; color: var(--text-faint); transition: transform .2s; }
details.thinking[open] summary::after { transform: rotate(90deg); }
details.thinking .t-body {
  padding: 2px 14px 10px; color: var(--text-dim); white-space: pre-wrap;
  font-family: var(--mono); font-size: 12px; line-height: 1.6; border-top: 1px solid var(--border-soft);
}

/* 工具卡片 */
.tool-card {
  margin: 4px 0 10px; border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
  background: var(--surface-2); font-family: var(--mono); font-size: 12.5px;
  overflow: hidden; animation: rise .2s ease;
}
.tool-card .t-head {
  padding: 7px 12px; display: flex; align-items: center; gap: 9px; cursor: pointer;
  user-select: none; transition: background .12s;
}
.tool-card .t-head:hover { background: var(--surface-3); }
.tool-card .t-icon { font-size: 13px; width: 16px; text-align: center; }
.tool-card .t-name { color: var(--info); font-weight: 600; }
.tool-card .t-arg { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.tool-card .t-status { display: inline-flex; align-items: center; gap: 5px; color: var(--text-faint); font-size: 11px; }
.tool-card .t-status.running { color: var(--warn); }
.tool-card .t-status.ok { color: var(--accent); }
.tool-card .t-status.err { color: var(--danger); }
.spinner { width: 10px; height: 10px; border: 2px solid var(--warn); border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.tool-card .t-body { display: none; border-top: 1px solid var(--border-soft); background: var(--surface-3); }
.tool-card.open .t-body { display: block; }
.tool-card .t-body pre { padding: 10px 14px; white-space: pre-wrap; word-break: break-all; font-size: 12px; line-height: 1.6; color: var(--text-2); font-family: var(--mono); }

/* diff 预览（edit/write 工具卡片） */
.diff-path { font-family: var(--mono); font-size: 11px; color: var(--text-dim); padding: 8px 12px 4px; }
.diff-block { font-family: var(--mono); font-size: 12px; line-height: 1.55; padding: 4px 0 8px; }
.diff-line { padding: 0 12px; white-space: pre-wrap; word-break: break-all; display: flex; }
.diff-line .sign { width: 16px; flex-shrink: 0; user-select: none; }
.diff-line del, .diff-line ins { text-decoration: none; flex: 1; min-width: 0; }
.diff-line.del { background: rgba(255, 92, 92, .09); }
.diff-line.del .sign, .diff-line.del del { color: #ff8f8f; }
.diff-line.add { background: rgba(0, 230, 118, .08); }
.diff-line.add .sign, .diff-line.add ins { color: #63e6a4; }
.diff-line.ctx { color: var(--text-faint); }
.diff-line.fold { color: var(--text-faint); font-size: 10.5px; padding: 2px 12px; background: var(--surface-3); }
.t-result { padding: 6px 12px 9px; border-top: 1px dashed var(--border-soft); color: var(--text-faint); font-size: 11px; font-family: var(--mono); }

/* 图片消息 */
.msg img.inline-img { max-width: min(420px, 100%); border-radius: 12px; display: block; margin-top: 6px; box-shadow: var(--shadow); }

/* ===== markdown ===== */
.md pre {
  position: relative; background: #0a0f0c; border: 1px solid var(--border-soft); border-radius: 10px;
  margin: 10px 0; font-size: 12.8px; line-height: 1.6; overflow: hidden;
}
.md pre .code-head {
  display: flex; align-items: center; gap: 8px; padding: 5px 12px;
  border-bottom: 1px solid var(--border-soft); background: var(--surface-3);
  font-family: var(--mono); font-size: 11px; color: var(--text-faint);
}
.md pre .code-head .lang { text-transform: lowercase; }
.md pre .code-head .copy {
  margin-left: auto; border: 1px solid var(--border); background: none; color: var(--text-dim);
  border-radius: 5px; padding: 1px 8px; font-size: 10.5px; cursor: pointer; font-family: var(--mono);
}
.md pre .code-head .copy:hover { color: var(--accent); border-color: var(--accent-border); }
.md pre code { display: block; padding: 11px 15px; overflow-x: auto; font-family: var(--mono); font-size: 13px; line-height: 1.65; }
.md pre code::-webkit-scrollbar { height: 7px; }
.md pre code::-webkit-scrollbar-thumb { background: #1c2b23; border-radius: 4px; }
.md p code, .md li code, .md h1 code, .md h2 code, .md h3 code, .md h4 code { background: rgba(0, 230, 118, .13); color: #4dedaa; padding: 1.5px 6px; border-radius: 4px; font-family: var(--mono); font-size: 13px; }
.md h1, .md h2, .md h3, .md h4 { margin: 16px 0 8px; line-height: 1.4; }
.md h1 { font-size: 18px; } .md h2 { font-size: 16.5px; } .md h3 { font-size: 15px; }
.md h1, .md h2 { padding-bottom: 5px; border-bottom: 1px solid var(--border-soft); }
.md h1, .md h2, .md h3 { color: var(--text); }
.md h4 { color: var(--text-2); }
.md ul, .md ol { padding-left: 22px; margin: 8px 0; }
.md li { margin: 3px 0; }
.md li::marker { color: var(--accent); }
.md a { color: var(--info); text-decoration: none; border-bottom: 1px solid rgba(109, 182, 255, .3); }
.md a:hover { border-bottom-color: var(--info); }
.md strong { color: #f4fff9; font-weight: 600; }
.md hr { border: none; border-top: 1px solid var(--border-soft); margin: 14px 0; }
.md blockquote { border-left: 3px solid var(--accent-border); padding: 2px 0 2px 14px; color: var(--text-2); margin: 10px 0; background: var(--accent-dim); border-radius: 0 8px 8px 0; padding-right: 10px; }
.md table { border-collapse: collapse; margin: 10px 0; font-size: 13px; width: 100%; }
.md th, .md td { border: 1px solid var(--border-soft); padding: 6px 12px; text-align: left; }
.md th { background: var(--surface-3); color: var(--text-2); font-weight: 600; }
.md tr:nth-child(even) td { background: var(--surface-3); }

/* 消息操作行：时间戳 + 图标按钮（hover 浮现，参考主流 webui 设计） */
.msg { position: relative; }
.msg-foot {
  display: flex; align-items: center; gap: 6px; margin-top: 3px; min-height: 20px;
}
.msg.user .msg-foot { justify-content: flex-end; }
.msg-foot .meta { margin: 0; }
.msg-actions { display: flex; gap: 1px; opacity: 0; transition: opacity .15s; }
.msg:hover .msg-actions { opacity: 1; }
.ma-icon {
  border: none; background: none; color: var(--text-faint); cursor: pointer;
  width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center;
  padding: 0; transition: color .13s, background .13s;
}
.ma-icon:hover { color: var(--text); background: var(--surface-3); }
.ma-icon.copied { color: var(--accent); }
.ma-icon svg { width: 14px; height: 14px; display: block; }

/* 空状态 */
#empty { text-align: center; color: var(--text-faint); margin-top: 22vh; font-size: 13px; line-height: 2.4; }
#empty .big { font-size: 15px; color: var(--text-dim); }

/* 滚动到底按钮 */
#scroll-btn {
  position: absolute; right: 26px; bottom: 18px; width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  cursor: pointer; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .15s;
  box-shadow: var(--shadow);
}
#scroll-btn.show { opacity: 1; pointer-events: auto; }
#scroll-btn:hover { color: var(--accent); border-color: var(--accent-border); transform: translateY(-2px); }

/* 顶部通知提示条（notice） */
#notice {
  position: fixed; top: 64px; left: 50%; transform: translateX(-50%) translateY(-8px);
  max-width: min(520px, calc(100vw - 32px));
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--warn); border-radius: 10px; padding: 9px 16px;
  font-size: 13px; line-height: 1.5; box-shadow: var(--shadow); z-index: 90;
  opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
  white-space: pre-wrap; word-break: break-word;
}
#notice.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 图片预览条（粘贴/拖拽到输入区） */
#image-bar { display: none; gap: 8px; padding: 12px 16px 0; flex-wrap: wrap; }
#image-bar.has { display: flex; }
#image-bar.warn {
  position: relative; padding-bottom: 6px;
}
#image-bar.warn::after {
  content: "⚠ 当前模型不支持图片，发送会被拒绝";
  width: 100%; font-size: 12px; color: var(--danger);
  padding-top: 6px; border-top: 1px dashed var(--danger);
}

.img-chip {
  position: relative; width: 66px; height: 66px; border-radius: 10px; overflow: hidden;
  border: 1px solid var(--border); box-shadow: 0 2px 10px rgba(0,0,0,.3);
  animation: rise .18s ease;
}
.img-chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-chip .img-rm {
  position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%;
  background: rgba(0,0,0,.72); color: #fff; border: none; cursor: pointer; font-size: 12px;
  line-height: 18px; padding: 0; display: grid; place-items: center;
}
.img-chip .img-rm:hover { background: var(--danger); }
#composer.dragging { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim), 0 4px 24px rgba(0,0,0,.35); }

/* ===== 输入区 ===== */
#composer-wrap { flex-shrink: 0; padding: 10px 22px 14px; }
.composer-inner { max-width: var(--chat-max); margin: 0 auto; position: relative; }
#composer {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35); transition: border-color .18s, box-shadow .18s;
  overflow: hidden;
}
#composer:focus-within { border-color: var(--accent-border); box-shadow: 0 0 0 3px var(--accent-dim), 0 4px 24px rgba(0,0,0,.35); }
#input {
  width: 100%; background: transparent; border: none; outline: none; resize: none;
  color: var(--text); font-family: var(--sans); font-size: 14.8px; line-height: 1.65;
  padding: 14px 58px 6px 16px; max-height: 180px;
}
#input::placeholder { color: var(--text-faint); }
#send {
  position: absolute; right: 10px; top: 8px; width: 36px; height: 36px; border-radius: 50%;
  border: none; cursor: pointer; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), #00a455); color: #04210f; font-size: 15px;
  transition: transform .12s, box-shadow .12s, opacity .12s;
  box-shadow: 0 2px 12px rgba(0, 230, 118, 0.3);
}
#composer { position: relative; }
#send:hover { transform: scale(1.06); box-shadow: 0 2px 18px rgba(0, 230, 118, 0.5); }
#send:disabled { opacity: .35; cursor: not-allowed; transform: none; }
#composer-tools {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px 10px;
  border-top: 1px solid var(--border-soft);
}
#composer-tools .pill { height: 26px; font-size: 11.5px; }
#composer-tools .caret { color: var(--text-faint); font-size: 10px; margin-left: 2px; }

/* thinking 滑块 */
.think-slider { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-family: var(--mono); color: var(--text-dim); }
.think-slider .k { color: var(--text-faint); }
.think-slider #thinking { color: var(--accent); min-width: 44px; font-weight: 600; }
#think-range {
  -webkit-appearance: none; appearance: none; width: 110px; height: 4px; border-radius: 2px;
  background: var(--border); outline: none; cursor: pointer;
}
#think-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 13px; height: 13px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 8px rgba(0, 230, 118, .45); cursor: pointer;
  transition: transform .12s;
}
#think-range::-webkit-slider-thumb:hover { transform: scale(1.2); }
#think-range::-moz-range-thumb {
  width: 13px; height: 13px; border-radius: 50%; border: none;
  background: var(--accent); box-shadow: 0 0 8px rgba(0, 230, 118, .45); cursor: pointer;
}
#think-range::-moz-range-track { height: 4px; border-radius: 2px; background: var(--border); }

/* 模型选择浮层（从 composer 向上弹出） */
.model-pop {
  display: none;
  position: absolute; top: auto; bottom: calc(100% + 6px); left: 0; right: auto;
  width: min(460px, 100%); max-height: 360px; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 -6px 32px rgba(0,0,0,.55); z-index: 30; animation: rise .16s ease;
}
.model-pop.show { display: flex; }
.pop-search { padding: 8px 10px; border-bottom: 1px solid var(--border-soft); }
.pop-search input {
  width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-family: var(--mono); font-size: 12px; padding: 6px 10px; outline: none;
}
.pop-search input:focus { border-color: var(--accent-border); }
#model-list { overflow-y: auto; padding: 4px; }
#model-list::-webkit-scrollbar { width: 7px; }
#model-list::-webkit-scrollbar-thumb { background: #1c2b23; border-radius: 4px; }
.mi {
  display: flex; flex-direction: column; gap: 3px;
  padding: 7px 10px; border-radius: 8px;
  cursor: pointer; font-family: var(--mono);
  border: 1px solid transparent;
  transition: background .12s, border-color .12s;
}
.mi:hover { background: var(--surface-2); border-color: var(--border); }
.mi.active {
  background: var(--accent-dim);
  border-color: var(--accent-border);
}
.mi-main {
  display: flex; align-items: center; gap: 8px; min-width: 0;
}
.mi-name {
  color: var(--text); font-size: 12.5px; font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  flex: 1; min-width: 0;
}
.mi-cur { color: var(--accent); font-size: 13px; flex-shrink: 0; line-height: 1; }
.mi-meta {
  display: flex; align-items: center; gap: 6px; min-width: 0;
}
.mi-prov {
  color: var(--text-faint); font-size: 10.5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  max-width: 140px;
}
.mi-badge {
  font-size: 9.5px; padding: 1px 5px; border-radius: 4px;
  flex-shrink: 0; font-weight: 600; letter-spacing: .3px;
}
.mi-badge.vision { background: rgba(109, 182, 255, .16); color: var(--info); }
.mi-badge.reasoning { background: rgba(255, 179, 0, .16); color: var(--warn); }
.mi-none { padding: 12px; color: var(--text-faint); font-size: 12px; text-align: center; }

/* 斜杠命令补全面板（位于 composer 外——composer 的 overflow:hidden 会裁掉越界浮层） */
#cmd-panel {
  display: none; position: absolute; left: 0; right: 0; bottom: calc(100% + 6px);
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 -6px 32px rgba(0,0,0,.55); max-height: 248px; overflow-y: auto; z-index: 20;
  padding: 4px;
}
#cmd-panel.show { display: block; animation: rise .14s ease; }
#cmd-panel::-webkit-scrollbar { width: 7px; }
#cmd-panel::-webkit-scrollbar-thumb { background: #1c2b23; border-radius: 4px; }
.cmd-item {
  display: flex; align-items: baseline; gap: 10px; padding: 6px 12px; cursor: pointer;
  border-radius: 8px; font-size: 12.5px;
}
.cmd-item .c-name { font-family: var(--mono); color: var(--accent); flex-shrink: 0; font-size: 12px; }
.cmd-item .c-desc {
  color: var(--text-dim); font-size: 11.5px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1;
}
.cmd-item .c-src {
  margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--text-faint);
  flex-shrink: 0; border: 1px solid var(--border-soft); border-radius: 4px; padding: 0 5px;
}
.cmd-item.active, .cmd-item:hover { background: var(--accent-dim); }
.cmd-none { padding: 12px; color: var(--text-faint); font-size: 12px; text-align: center; }
#deliver { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-faint); font-family: var(--mono); }
#deliver select {
  background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 6px; font-family: var(--mono); font-size: 11px; outline: none; cursor: pointer;
}
#deliver select:hover { border-color: var(--accent-border); }
#abort {
  display: inline-flex; align-items: center; gap: 5px; background: var(--danger-dim);
  color: var(--danger); border: 1px solid rgba(255, 92, 92, .3); border-radius: 7px;
  padding: 4px 11px; font-size: 11.5px; cursor: pointer; font-family: var(--mono);
  transition: background .15s;
}
#abort:hover { background: rgba(255, 92, 92, .2); }
#abort:disabled { opacity: .3; cursor: not-allowed; }
.hint { text-align: right; color: var(--text-faint); font-size: 10.5px; font-family: var(--mono); margin-top: 6px; padding-right: 4px; }

/* ===== 顶栏状态徽章 + 浮层（替代右侧栏：默认干净，点击查看详情） ===== */
.stat-pill .si { color: var(--text-faint); font-size: 11px; }
.stat-pill.warn { border-color: rgba(255, 179, 0, .4); color: var(--warn); }
.stat-pill.error { border-color: rgba(255, 92, 92, .4); color: var(--danger); }
.popover {
  display: none; position: fixed; top: 58px; right: 16px; width: 340px; z-index: 60;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 12px 40px rgba(0,0,0,.55); animation: rise .16s ease;
}
.popover.show { display: block; }
.pop-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-bottom: 1px solid var(--border-soft);
  font-size: 12px; font-weight: 600; color: var(--text-2); font-family: var(--mono); letter-spacing: .4px;
}
.pop-body { padding: 12px 14px; font-size: 12.5px; }
.c-refresh {
  margin-left: auto; border: none; background: none; color: var(--text-faint);
  cursor: pointer; font-size: 14px; padding: 0 4px; border-radius: 5px; line-height: 1;
}
.c-refresh:hover { color: var(--accent); }

/* git 浮层内容 */
#git-summary { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#git-summary .branch { font-family: var(--mono); color: var(--accent); font-size: 13px; font-weight: 600; }
#git-summary .chips { display: flex; gap: 5px; font-family: var(--mono); font-size: 11px; }
.chip { padding: 1px 7px; border-radius: 999px; }
.chip.added { background: rgba(0, 230, 118, .12); color: var(--accent); }

#git-files { margin-top: 9px; border-top: 1px solid var(--border-soft); max-height: 200px; overflow-y: auto; }
#git-files::-webkit-scrollbar { width: 7px; }
#git-files::-webkit-scrollbar-thumb { background: #1c2b23; border-radius: 4px; }
.gf-item {
  display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px;
  cursor: pointer; font-family: var(--mono); font-size: 11.5px; color: var(--text-2);
}
.gf-item:hover { background: var(--surface-3); }
.gf-item.sel { background: var(--accent-dim); color: var(--text); }
.gf-item .gf-x { width: 14px; text-align: center; flex-shrink: 0; font-size: 11px; }
.gf-item .gf-x.A { color: var(--accent); }
.gf-item .gf-x.M { color: var(--warn); }
.gf-item .gf-x.D { color: var(--danger); }
.gf-item .gf-x.?? { color: var(--info); }
.gf-item .gf-path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#git-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.gbtn {
  border: 1px solid var(--border); background: var(--surface-3); color: var(--text-2);

/* 余额 / 消耗浮层内容 */

#balance-amount.ok { color: var(--accent); }
#balance-amount.warning { color: var(--warn); }

#balance-detail { color: var(--text-dim); font-size: 11.5px; margin-top: 4px; line-height: 1.6; }

#cost-stats b { color: var(--text); font-weight: 600; }

#session-meta .sm-row { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 响应式：窄屏隐藏侧栏 */
@media (max-width: 980px) { .popover { width: min(340px, 92vw); right: 4vw; } }

<body>

<div id="app" class="chat-mode">

<!-- 会话列表视图（无 pid 时显示） -->

  <div class="slv-head">
    <div class="brand"><span class="logo">π</span>pi WebUI</div>
    <div class="slv-sub">选择要查看的会话</div>
  </div>

<script>
"use strict";
/* ============================================================
 * pi WebUI 前端：SSE 实时事件 + REST 操作
 * 与 TUI 共享同一会话：消息/工具/状态实时同步，双向操作。
 * ============================================================ */

// ---- token 管理：URL 读取 → sessionStorage 缓存 → 地址栏清理 ----
const token = new URLSearchParams(location.search).get("token") || sessionStorage.getItem("webuiToken") || "";
if (token) sessionStorage.setItem("webuiToken", token);
if (location.search) history.replaceState(null, "", location.pathname);

// ---- 路由：/s/<pid>/ = 会话聊天页；/ = 会话列表页 ----
const routeMatch = location.pathname.match(/^\/s\/(\d+)\/?/);
const sessionPid = routeMatch ? routeMatch[1] : null;
/** 会话级 API 前缀（列表视图为空串） */
const S = sessionPid ? `/s/${sessionPid}` : "";
if (!sessionPid) document.body.classList.add("list-mode");

// ---- DOM ----
const chat = document.getElementById("chat");
const empty = document.getElementById("empty");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const abortBtn = document.getElementById("abort");
const noticeEl = document.getElementById("notice");
const scrollBtn = document.getElementById("scroll-btn");

const $ = (id) => document.getElementById(id);
const chatInner = () => chat.querySelector(".chat-inner") || makeChatInner();

function makeChatInner() {
  const el = document.createElement("div");
  el.className = "chat-inner";
  chat.insertBefore(el, empty); // 空状态元素保留在下方
  return el;
}
function ensureInner() {
  const el = chat.querySelector(".chat-inner");
  if (el) return el;
  // 迁移旧的空状态容器
  return makeChatInner();
}
chat.addEventListener("scroll", () => {
  const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 260;
  scrollBtn.classList.toggle("show", !nearBottom);
});
scrollBtn.addEventListener("click", scrollBottom);

function notice(text, ms = 2600) {
  noticeEl.textContent = text;
  noticeEl.classList.add("show");
  clearTimeout(notice._t);
  notice._t = setTimeout(() => noticeEl.classList.remove("show"), ms);
}

// ---- API ----
async function api(path, body) {
  const res = await fetch(S + path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "Authorization": "Bearer " + token, ...(body === undefined ? {} : { "Content-Type": "application/json" }) },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// ---- 轻量 markdown 渲染 ----
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function inlineMd(s) {
  return escapeHtml(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(text) {
  const blocks = text.split(/```/);
  let out = "";
  for (let i = 0; i < blocks.length; i++) {
    if (i % 2 === 1) {
      // 代码块：首行语言标签 + 复制按钮头
      const firstLine = blocks[i].split("\n")[0] || "";
      const lang = (firstLine.trim() || "code");
      const code = blocks[i].split("\n").slice(1).join("\n");
      const copyBtn = code.length < 8000
        ? `<button class="copy" data-code="${encodeURIComponent(code)}">复制</button>`
        : "";
      out += `<pre><div class="code-head"><span class="lang">${escapeHtml(lang)}</span>${copyBtn}</div><code>${escapeHtml(code)}</code></pre>`;
    } else {
      // 收集连续表格行 → <table>；连续列表行 → <ul>/<ol>
      const lines = blocks[i].split("\n");
      let tableRows = [];
      let isTable = false;
      let listBuf = [];
      let listType = null; // "ul" | "ol"
      const flushList = () => {
        if (!listBuf.length) return;
        out += `<${listType}>${listBuf.join("")}</${listType}>`;
        listBuf = [];
        listType = null;
      };
      const flushTable = () => {
        if (!tableRows.length) return;
        const header = tableRows[0];
        const data = tableRows.slice(1);
        const cell = (r) => r.split("|").slice(1, -1).map((c) => `<td>${inlineMd(c.trim())}</td>`).join("");
        out += `<table><thead><tr>${cell(header)}</tr></thead><tbody>${data.map((r) => `<tr>${cell(r)}</tr>`).join("")}</tbody></table>`;
        tableRows = [];
      };
      for (const line of lines) {
        const t = line.trim();
        if (/^\|.*\|$/.test(t)) {
          if (/^\|\s*[:|\-\s]*\|$/.test(t)) continue; // 表头分隔行
          flushList();
          if (!isTable) { isTable = true; tableRows = []; }
          tableRows.push(t);
        } else {
          if (isTable) { isTable = false; flushTable(); }
          if (/^[-*]\s/.test(t)) {
            if (listType && listType !== "ul") flushList();
            listType = "ul";
            listBuf.push(`<li>${inlineMd(t.replace(/^[-*]\s*/, ""))}</li>`);
          } else if (/^\d+\.\s/.test(t)) {
            if (listType && listType !== "ol") flushList();
            listType = "ol";
            listBuf.push(`<li>${inlineMd(t.replace(/^\d+\.\s*/, ""))}</li>`);
          } else {
            flushList();
            const tl = t;
            if (/^#{1,4}\s/.test(tl)) {
              const level = tl.match(/^#+/)[0].length;
              out += `<h${level}>${inlineMd(tl.replace(/^#+\s*/, ""))}</h${level}>`;
            }
            else if (/^>/.test(tl)) out += `<blockquote>${inlineMd(tl.replace(/^>\s*/, ""))}</blockquote>`;
            else if (/^---+$/.test(tl)) out += `<hr>`;
            else if (tl === "") out += "";
            else out += `<p>${inlineMd(line)}</p>`;
          }
        }
      }
      if (isTable) flushTable();
      flushList();
    }
  }
  return out;
}
// 复制按钮事件委托
document.addEventListener("click", (e) => {
  const btn = e.target.closest(".copy");
  if (!btn) return;
  const code = decodeURIComponent(btn.dataset.code || "");
  navigator.clipboard.writeText(code).then(() => {
    const old = btn.textContent;
    btn.textContent = "✓ 已复制";
    setTimeout(() => (btn.textContent = old), 1500);
  }).catch(() => notice("复制失败", 2000));
});

// ---- 消息内容解析 ----
function contentText(content) {
  if (typeof content === "string") return content;
  if (Array.isArray(content)) return content.map((c) => c.text ?? c.thinking ?? "").join("");
  return "";
}
function contentImages(content) {
  if (!Array.isArray(content)) return [];
  // 兼容扁平（{data,mimeType}，pi-ai 存储格式）与嵌套（{source:{data,mediaType}}）两种
  return content
    .filter((c) => c.type === "image" && (c.data || c.source?.data))
    .map((c) => ({ data: c.data ?? c.source?.data ?? "", mime: c.mimeType ?? c.source?.mediaType ?? "image/png" }));
}
function contentThinking(content) {
  if (!Array.isArray(content)) return null;
  const t = content.find((c) => c.type === "thinking" && (c.text || c.thinking));
  return t ? (t.text ?? t.thinking ?? "") : null;
}

// ---- 聊天区渲染 ----
const streamingState = {
  el: null, textNode: null, thinkingEl: null, hasText: false,
  rawText: "",      // 流式累积原文（节流 markdown 渲染用）
  renderTimer: null, // 节流定时器
};
let lastUserCard = null; // 最近一张用户消息卡片（message_end 补绑 entryId 用）
let lastAssistantRaw = ""; // 最近 assistant 消息原文（复制按钮用）

function scrollBottom() {
  chat.scrollTop = chat.scrollHeight;
  scrollBtn.classList.remove("show");
}

function fmtTime(ts) {
  return new Date(ts ?? Date.now()).toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit" });
}

// ---- 消息操作行：时间戳 + SVG 图标按钮（复制 / 编辑重发 / 重新生成） ----
let pendingForkText = null; // 回退后待填入输入框的原文

const MA_ICONS = {
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  fork: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>',
  regen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>',
};

function iconBtn(icon, title, onClick) {
  const b = document.createElement("button");
  b.className = "ma-icon";
  b.title = title;
  b.innerHTML = MA_ICONS[icon];
  b.addEventListener("click", onClick);
  return b;
}

/** 消息底行：时间戳 + 操作图标（hover 浮现） */
function makeMsgFoot(rawText, isUser, cardEl) {
  const foot = document.createElement("div");
  foot.className = "msg-foot";
  const meta = document.createElement("span");
  meta.className = "meta";
  meta.textContent = fmtTime() + (isUser ? "" : " · assistant");
  const actions = document.createElement("div");
  actions.className = "msg-actions";

  const copyBtn = iconBtn("copy", "复制", () => {
    navigator.clipboard.writeText(rawText()).then(() => {
      copyBtn.innerHTML = MA_ICONS.check;
      copyBtn.classList.add("copied");
      setTimeout(() => { copyBtn.innerHTML = MA_ICONS.copy; copyBtn.classList.remove("copied"); }, 1400);
    }).catch(() => notice("复制失败", 2000));
  });
  actions.appendChild(copyBtn);

  if (isUser) {
    actions.appendChild(iconBtn("fork", "编辑重发（回退到此消息）", () => doFork(cardEl, rawText())));
  } else {
    actions.appendChild(iconBtn("regen", "重新生成（回退到上一条你的消息）", () => {
      let el = cardEl.previousElementSibling;
      while (el && !(el.classList?.contains("msg") && el.classList.contains("user"))) el = el.previousElementSibling;
      if (!el?.dataset?.entryId) { notice("找不到可回退的用户消息", 2500); return; }
      doFork(el, el.dataset.rawText || "");
    }));
  }
  foot.append(meta, actions);
  return foot;
}

/** 回退：存原文 → POST fork → 等 session_start(fork) 事件后填入输入框（见 onEvent） */
async function doFork(cardEl, text) {
  const entryId = cardEl?.dataset?.entryId;
  if (!entryId) { notice("该消息尚无回退锚点（请稍候或刷新）", 2500); return; }
  if (!confirm("回退到这条消息？之后的对话将从会话中分叉。")) return;
  pendingForkText = text;
  notice("回退中…", 1500);
  try {
    const r = await api("/api/fork", { entryId });
    if (!r.ok) { pendingForkText = null; notice(`回退失败：${r.error}`, 3500); }
    // fork 成功会触发 session 替换 → SSE 重连 + session_start 事件里完成重建与填文
  } catch {
    // fork 导致旧 server 释放，本次请求可能连接中断——属预期，等 session_start 即可
  }
}

function appendStreamText(delta) {
  if (!streamingState.textNode) return;
  streamingState.rawText += delta;
  streamingState.hasText = true;
  scheduleStreamRender();
}

/** 流式渲染节流：120ms 合并一次全量 markdown 重渲染（避免裸露标记，也避免每 delta 都渲染） */
function scheduleStreamRender() {
  if (streamingState.renderTimer) return;
  streamingState.renderTimer = setTimeout(() => {
    streamingState.renderTimer = null;
    if (streamingState.textNode && streamingState.rawText) {
      streamingState.textNode.innerHTML = md(streamingState.rawText);
      scrollBottom();
    }
  }, 120);
}

function appendThinkingDelta(delta) {
  const t = streamingState.thinkingEl;
  if (!t) return;
  // 默认折叠：不自动展开，仅以 active 脉冲提示「思考中…」
  t.details.classList.add("active");
  t.body.append(delta);
}

function finishAssistantMsg(message, withTools = false, entryId = null) {
  if (!streamingState.el) return;
  const wrap = streamingState.el;
  wrap.classList.remove("streaming");
  const content = message.content;
  const thinking = contentThinking(content);
  const text = contentText(content).trim();
  const hasStreamText = streamingState.hasText;
  lastAssistantRaw = text;
  if (entryId) wrap.dataset.entryId = entryId;

  // thinking 折叠（默认收起，流式结束去掉脉冲）
  const t = wrap.querySelector("details.thinking");
  t.classList.remove("active");
  if (thinking) {
    t.querySelector(".t-body").textContent = thinking;
    t.querySelector("summary").textContent = "";
    t.open = false;
  } else {
    t.remove();
  }

  // 正文（markdown 重建）
  const textEl = wrap.querySelector(".stream-text");
  if (text) {
    textEl.innerHTML = md(text);
  } else if (hasStreamText) {
    textEl.innerHTML = md(streamingState.rawText); // 以累积原文为准（非 textContent，避免双重转义）
  } else {
    textEl.remove();
  }

  // 图片
  const body = wrap.querySelector(".body");
  for (const img of contentImages(content)) {
    const el = document.createElement("img");
    el.className = "inline-img";
    el.src = `data:${img.mime};base64,${img.data}`;
    body.appendChild(el);
  }

  // 历史加载时补充工具调用卡片（事件流场景已由 tool_start/end 单独渲染）。
  // pi-ai 的 ToolCall 是驼峰式 {type:"toolCall", id, name, arguments}，兼容蛇形字段。
  // 卡片 id 与 toolResult 消息的 toolCallId 一致——后续 toolResult 会合并进同一张卡（不重复）。
  if (withTools && Array.isArray(content)) {
    for (const c of content) {
      if (c.type !== "tool_call" && c.type !== "toolCall") continue;
      const id = c.id || c.toolCallId || "tc" + Math.random().toString(36).slice(2, 8);
      const name = c.name || c.toolName || "tool";
      const args = c.arguments ?? c.args ?? {};
      addToolCard(id, name, args);
    }
  }

  // 操作行（时间戳 + 复制 / 重新生成图标）
  wrap.appendChild(makeMsgFoot(() => lastAssistantRaw, false, wrap));

  scrollBottom();
  if (streamingState.renderTimer) { clearTimeout(streamingState.renderTimer); }
  streamingState.el = null;
  streamingState.textNode = null;
  streamingState.thinkingEl = null;
  streamingState.rawText = "";
  streamingState.renderTimer = null;
}

// ---- diff 预览（edit/write 工具） ----
/** LCS 行级 diff：返回 [{t:" "|"-"|"+", text}] */
function lineDiff(a, b) {
  const A = String(a ?? "").split("\n"), B = String(b ?? "").split("\n");
  const n = A.length, m = B.length;
  if (n * m > 40000) { // 超大块退化为全删全增，避免 O(n·m) 卡顿
    return [...A.map((t) => ({ t: "-", text: t })), ...B.map((t) => ({ t: "+", text: t }))];
  }
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { out.push({ t: " ", text: A[i] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push({ t: "-", text: A[i] }); i++; }
    else { out.push({ t: "+", text: B[j] }); j++; }
  }
  while (i < n) out.push({ t: "-", text: A[i++] });
  while (j < m) out.push({ t: "+", text: B[j++] });
  return out;
}

/** diff 行数组 → HTML（连续相同行超过 5 行时折叠中段） */
function diffHtml(lines) {
  let html = "";
  let ctxRun = [];
  const flushCtx = () => {
    if (ctxRun.length <= 5) {
      for (const l of ctxRun) html += `<div class="diff-line ctx"><span class="sign"> </span><del>${escapeHtml(l.text)}</del></div>`;
    } else {
      const head = ctxRun.slice(0, 2), tail = ctxRun.slice(-2);
      for (const l of head) html += `<div class="diff-line ctx"><span class="sign"> </span><del>${escapeHtml(l.text)}</del></div>`;
      html += `<div class="diff-line fold">⋯ ${ctxRun.length - 4} 行未更改</div>`;
      for (const l of tail) html += `<div class="diff-line ctx"><span class="sign"> </span><del>${escapeHtml(l.text)}</del></div>`;
    }
    ctxRun = [];
  };
  for (const l of lines) {
    if (l.t === " ") { ctxRun.push(l); continue; }
    flushCtx();
    if (l.t === "-") html += `<div class="diff-line del"><span class="sign">-</span><del>${escapeHtml(l.text)}</del></div>`;
    else html += `<div class="diff-line add"><span class="sign">+</span><ins>${escapeHtml(l.text)}</ins></div>`;
  }
  flushCtx();
  return html;
}

/** edit 工具参数 → diff HTML；无法解析时返回 null（回退普通渲染） */
function renderEditDiff(args) {
  if (!args || typeof args !== "object") return null;
  const edits = Array.isArray(args.edits)
    ? args.edits
    : (typeof args.oldText === "string" ? [{ oldText: args.oldText, newText: args.newText }] : null);
  if (!edits || !edits.length) return null;
  let html = args.path ? `<div class="diff-path">${escapeHtml(args.path)}</div>` : "";
  edits.forEach((e, i) => {
    if (edits.length > 1) html += `<div class="diff-path">#${i + 1}</div>`;
    html += `<div class="diff-block">${diffHtml(lineDiff(e.oldText, e.newText))}</div>`;
  });
  return html;
}

/** write 工具参数 → 全量新增预览（截断 60 行） */
function renderWritePreview(args) {
  if (!args || typeof args.content !== "string") return null;
  const lines = args.content.split("\n");
  const shown = lines.slice(0, 60);
  let html = args.path ? `<div class="diff-path">${escapeHtml(args.path)}（新文件）</div>` : "";
  html += `<div class="diff-block">` + shown.map((t) => `<div class="diff-line add"><span class="sign">+</span><ins>${escapeHtml(t)}</ins></div>`).join("");
  if (lines.length > 60) html += `<div class="diff-line fold">⋯ 共 ${lines.length} 行，预览前 60 行</div>`;
  html += `</div>`;
  return html;
}

/** 按工具类型生成 body 预览 HTML（不支持则 null） */
function toolPreviewHtml(toolName, args) {
  if (toolName === "edit" || toolName === "multi-edit") return renderEditDiff(args);
  if (toolName === "write") return renderWritePreview(args);
  return null;
}

function addToolCard(toolCallId, toolName, args) {
  const inner = ensureInner();
  const card = document.createElement("div");
  card.className = "tool-card";
  card.dataset.id = toolCallId;
  const head = document.createElement("div");
  head.className = "t-head";
  const icon = document.createElement("span");
  icon.className = "t-icon";
  icon.textContent = toolIcon(toolName);
  const name = document.createElement("span");
  name.className = "t-name";
  name.textContent = toolName;
  const arg = document.createElement("span");
  arg.className = "t-arg";
  // diff 预览卡用文件路径作摘要（args 里是代码块，JSON 太长无意义）；其余显示参数摘要
  const argText = (toolName === "edit" || toolName === "write") && args && typeof args === "object" && args.path
    ? args.path
    : (typeof args === "string" ? args : JSON.stringify(args ?? {}));
  arg.textContent = argText.length > 90 ? argText.slice(0, 90) + "…" : argText;
  arg.title = argText;
  const status = document.createElement("span");
  status.className = "t-status running";
  status.innerHTML = '<span class="spinner"></span>运行中';
  const body = document.createElement("div");
  body.className = "t-body";
  // edit/write：直接渲染 diff 预览（参数在调用阶段就有，无需等结果）
  const preview = toolPreviewHtml(toolName, args);
  if (preview) {
    body.innerHTML = preview;
    card.dataset.preview = "1";
    card.classList.add("open"); // diff 预览默认展开
  } else {
    const pre = document.createElement("pre");
    pre.textContent = "运行中…";
    body.appendChild(pre);
  }
  head.append(icon, name, arg, status);
  card.append(head, body);
  head.addEventListener("click", () => card.classList.toggle("open"));
  inner.appendChild(card);
  scrollBottom();
  return card;
}
function finishToolCard(toolCallId, isError, result) {
  const card = chat.querySelector(`.tool-card[data-id="${CSS.escape(toolCallId)}"]`);
  if (!card) return;
  const status = card.querySelector(".t-status");
  status.className = "t-status " + (isError ? "err" : "ok");
  status.textContent = isError ? "✗ 出错" : "✓ 完成";
  if (card.dataset.preview) {
    // diff 预览卡：结果以小字追加到底部（不覆盖预览）
    const r = document.createElement("div");
    r.className = "t-result";
    r.textContent = result;
    card.querySelector(".t-body").appendChild(r);
  } else {
    card.querySelector(".t-body pre").textContent = result;
  }
  card.classList.add("open");
}

const EMPTY_NEW_CHAT = '<div class="big">新对话</div>在下方输入消息，开始与 AI 对话';
async function loadHistory() {
  const { entries } = await api("/api/history");
  const inner = ensureInner();
  inner.querySelectorAll(".msg, .tool-card").forEach((el) => el.remove());
  const has = entries.some((e) => e.type === "message" && e.message);
  if (!has) {
    // 无历史 = 全新对话：别再挂「连接中…」（连接其实已就绪），换成新对话引导
    empty.innerHTML = EMPTY_NEW_CHAT;
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";
  for (const e of entries) {
    if (e.type !== "message" || !e.message) continue;
    const m = e.message;
    if (m.role === "user") {
      addUserMsg(contentText(m.content), contentImages(m.content), e.id);
    } else if (m.role === "assistant") {
      const wrap = newAssistantMsg();
      finishAssistantMsg(m, true, e.id); // 历史加载：补渲染工具调用卡片 + 绑定 entryId
      wrap.classList.remove("streaming");
    } else if (m.role === "toolResult") {
      const id = m.toolCallId || "r" + e.id;
      // 若 assistant 的 toolCall 已建卡则合并填充结果，否则新建
      const existing = chat.querySelector(`.tool-card[data-id="${CSS.escape(id)}"]`);
      if (!existing) addToolCard(id, m.toolName || "tool", "");
      finishToolCard(id, !!m.isError, contentText(m.content).slice(0, 1200));
    }
  }
  scrollBottom();
}

// ---- 顶栏 / 状态 ----
const connPill = $("conn-pill");
const connText = $("conn-text");
const modelEl = $("model");
const thinkingEl = $("thinking");
const sessionName = $("session-name");

let selFiles = new Set();

function setBusy(busy) {
  connPill.className = "pill " + (busy ? "conn-busy" : "conn-ok");
  connText.textContent = busy ? "运行中" : "空闲";
  abortBtn.disabled = !busy;
}
function setConn(text) {
  connText.textContent = text;
}

function fmtTokens(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(n);
}
function fmtDur(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}h${String(m).padStart(2, "0")}m` : `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function updateState(s) {
  if (!s) { setConn("已连接"); return; } // 快照缺失（如 ctx 未就绪）也别卡在「连接中…」
  setBusy(!s.idle);
  modelEl.textContent = s.model ? `${s.model.provider}/${s.model.id}` : "–";
  modelEl.title = "点击切换模型";
  setThinkUI(s.thinkingLevel);
  sessionName.textContent = s.sessionName || s.cwd || "–";
  sessionName.title = s.sessionFile || s.cwd || "";

  // 余额（浮层 + 徽章）
  const bal = $("balance-amount");
  const balDetail = $("balance-detail");
  const balPill = $("stat-balance-text");
  const balPillBox = $("stat-balance");
  balPillBox.classList.remove("warn", "error");
  if (!s.balance) {
    bal.textContent = "–"; bal.className = "ok"; balDetail.textContent = "";
    balPill.textContent = "–";
  } else if (s.balance.error) {
    bal.textContent = "查询失败"; bal.className = "error"; balDetail.textContent = s.balance.error;
    balPill.textContent = "失败"; balPillBox.classList.add("error");
  } else if (s.balance.data) {
    const d = s.balance.data;
    bal.textContent = d.amount; bal.className = d.status;
    // detail 与 quotas 内容常重复：有 quotas 优先拼 quotas，否则用 detail
    const quotaText = d.quotas?.length ? d.quotas.map((q) => `${q.label} ${q.used}/${q.limit}`).join(" · ") : "";
    balDetail.textContent = quotaText || d.detail || "";
    if (d.link) balDetail.textContent += (balDetail.textContent ? "\n" : "") + d.link.url;
    balPill.textContent = d.amount;
    if (d.status === "warning") balPillBox.classList.add("warn");
    else if (d.status === "error") balPillBox.classList.add("error");
  } else {
    bal.textContent = "无接口"; bal.className = "ok"; balDetail.textContent = "";
    balPill.textContent = "无接口";
  }

  // 消耗（浮层 + 徽章）
  const c = s.cost;
  if (c) {
    const money = [];
    if (c.costTotalCny > 0) money.push(`¥${c.costTotalCny.toFixed(4)}`);
    if (c.costTotalUsd > 0) money.push(`$${c.costTotalUsd.toFixed(4)}`);
    const src = c.rateSource === "live" ? "实时" : c.rateSource === "cached" ? "缓存" : "无";
    $("cost-stats").innerHTML =
      `输入 <b>${fmtTokens(c.input)}</b> · 输出 <b>${fmtTokens(c.output)}</b> · 缓存 <b>${fmtTokens(c.cacheRead)}</b>` +
      `<br>费用 ${money.length ? `<b>${money.join(" + ")}</b>` : "<b>0</b>"}` +
      (c.rateText ? `<br><span id="cost-rate">${escapeHtml(c.rateText)}</span>` : "") +
      `<br><span id="cost-src">汇率 ${src}${c.usdCny ? ` (¥${c.usdCny.toFixed(2)})` : ""} · 会话 ${fmtDur(c.uptimeSec)}</span>`;
    // 徽章：费用简写（两位小数）
    const brief = [];
    if (c.costTotalCny > 0) brief.push(`¥${c.costTotalCny.toFixed(2)}`);
    if (c.costTotalUsd > 0) brief.push(`$${c.costTotalUsd.toFixed(2)}`);
    $("stat-cost-text").textContent = brief.length ? brief.join("+") : "¥0";
  }

  // 会话元信息（路径单行 ellipsis，完整值在 title）
  const baseName = (p) => (p ? p.replace(/[\\/]+$/, "").split(/[\\/]/).pop() || p : "–");
  $("session-meta").innerHTML =
    `<div class="sm-row" title="${escapeHtml(s.cwd)}">cwd <b>${escapeHtml(s.cwd)}</b></div>` +
    `<div class="sm-row">会话 ${escapeHtml(s.sessionName || "–")}</div>` +
    `<div class="sm-row" title="${escapeHtml(s.sessionFile || "内存会话")}">文件 ${escapeHtml(s.sessionFile ? baseName(s.sessionFile) : "内存会话")}</div>`;

  // git
  renderGit(s.git);
}

// ---- git 面板 ----
function renderGit(g) {
  const sum = $("git-summary");
  const filesEl = $("git-files");
  const pillText = $("stat-git-text");
  if (!g || !g.branch) {
    sum.innerHTML = '<span class="branch">非 git 仓库</span>';
    filesEl.innerHTML = "";
    pillText.textContent = "非仓库";
    return;
  }
  // 徽章浓缩文本：分支 + 脏文件数
  const dirtyCount = (g.staged || 0) + (g.unstaged || 0) + (g.untracked || 0);
  pillText.textContent = g.branch + (dirtyCount ? ` ${dirtyCount}` : " ✓");
  const chips = [];
  if (g.clean) chips.push('<span class="chip clean">✓ 干净</span>');
  if (g.staged) chips.push(`<span class="chip added">+${g.staged}</span>`);
  if (g.unstaged) chips.push(`<span class="chip modified">~${g.unstaged}</span>`);
  if (g.untracked) chips.push(`<span class="chip untracked">?${g.untracked}</span>`);
  if (g.ahead || g.behind) chips.push(`<span class="chip away">↑${g.ahead}↓${g.behind}</span>`);
  sum.innerHTML = `<span class="branch">⎇ ${escapeHtml(g.branch)}</span><span class="chips">${chips.join("")}</span>`;

  // 文件列表（按分类分组：staged / unstaged / untracked）
  filesEl.innerHTML = "";
  selFiles = new Set();
  const items = g.items || [];
  const order = { A: 0, M: 1, D: 2, "??": 3 };
  const sorted = [...items].sort((a, b) => (order[a.xy] ?? 9) - (order[b.xy] ?? 9));
  for (const f of sorted) {
    const row = document.createElement("div");
    row.className = "gf-item";
    const xy = document.createElement("span");
    xy.className = "gf-x " + (f.xy === "??" ? "??" : f.xy[0]);
    xy.textContent = f.xy === "??" ? "?" : f.xy[0];
    const p = document.createElement("span");
    p.className = "gf-path";
    p.textContent = f.path;
    p.title = f.path;
    row.append(xy, p);
    const ns = g.numStats?.[f.path];
    if (ns && !ns.binary) {
      const n = document.createElement("span");
      n.className = "gf-num";
      n.textContent = ns.added || ns.removed ? `+${ns.added}-${ns.removed}` : "";
      row.appendChild(n);
    }
    row.addEventListener("click", () => {
      row.classList.toggle("sel");
      if (selFiles.has(f.path)) selFiles.delete(f.path);
      else selFiles.add(f.path);
    });
    filesEl.appendChild(row);
  }
}

// git 操作
document.querySelectorAll("#git-actions .gbtn").forEach((btn) => {
  btn.addEventListener("click", () => gitAction(btn.dataset.gop));
});
$("git-refresh").addEventListener("click", () => gitAction("status"));
async function gitAction(op) {
  const paths = [...selFiles];
  try {
    if (op === "commit") {
      const msg = prompt("提交信息：");
      if (msg === null) return;
      if (!msg.trim()) { notice("提交信息不能为空", 2500); return; }
      notice(`git commit…`, 1500);
      const r = await api("/api/git", { op, message: msg });
      if (!r.ok) return notice(`提交失败：${r.error}`, 4000);
      notice(`已提交：${msg.slice(0, 40)}`, 2500);
    } else if (op === "discard" && paths.length) {
      if (!confirm(`确认丢弃 ${paths.length} 个文件的改动？不可恢复。`)) return;
      notice(`git discard…`, 1500);
      const r = await api("/api/git", { op, paths });
      if (!r.ok) return notice(`丢弃失败：${r.error}`, 4000);
      notice("已丢弃", 1800);
    } else if (op === "add" || op === "reset") {
      if (!paths.length) { notice("先在文件列表选中文件", 2200); return; }
      notice(`git ${op}…`, 1500);
      const r = await api("/api/git", { op, paths });
      if (!r.ok) return notice(`${op} 失败：${r.error}`, 4000);
    } else {
      notice(`git ${op}…`, 1500);
      const r = await api("/api/git", { op });
      if (!r.ok) return notice(`${op} 失败：${r.error}`, 4000);
      notice(`git ${op} 完成`, 1800);
    }
    const r = await api("/api/git", { op: "status" });
    if (r.ok && r.data) renderGit(r.data);
  } catch (e) {
    notice(`git ${op} 失败：${e.message}`, 4000);
  }
}

// ---- 模型选择器（搜索浮层）+ thinking 滑块 ----
const modelPill = $("model-pill");
const modelPop = $("pop-model");
const modelSearch = $("model-search");
const modelList = $("model-list");
const thinkRange = $("think-range");
const THINK_LEVELS = ["off", "minimal", "low", "medium", "high", "xhigh", "max"];
let allModels = [];
let modelActive = -1;
/** 当前模型是否支持图片（视觉）；未知时乐观为 true，发送时后端还有兜底校验 */
let currentVision = true;

/** 从 allModels 里当前模型（current 标记）刷新 currentVision */
function refreshCurrentVision() {
  const cur = allModels.find((m) => m.current);
  currentVision = cur ? !!cur.vision : true;
  updateImageWarn();
}

async function fetchModels() {
  try {
    const { models } = await api("/api/models");
    allModels = Array.isArray(models) ? models : [];
  } catch { allModels = []; }
  refreshCurrentVision();
}

function renderModelList() {
  const q = modelSearch.value.trim().toLowerCase();
  const filtered = allModels.filter((m) => !q || `${m.provider}/${m.id}`.toLowerCase().includes(q));
  modelList.innerHTML = "";
  if (!filtered.length) {
    modelList.innerHTML = '<div class="mi-none">无匹配模型</div>';
    modelActive = -1;
    return;
  }
  filtered.slice(0, 50).forEach((m, i) => {
    const item = document.createElement("div");
    item.className = "mi" + (i === modelActive ? " active" : "");
    item.title = `${m.provider}/${m.id}`;

    const main = document.createElement("div");
    main.className = "mi-main";

    const name = document.createElement("span");
    name.className = "mi-name";
    name.textContent = m.id;
    main.appendChild(name);

    if (m.current) {
      const c = document.createElement("span");
      c.className = "mi-cur";
      c.textContent = "✓";
      main.appendChild(c);
    }

    const meta = document.createElement("div");
    meta.className = "mi-meta";

    const prov = document.createElement("span");
    prov.className = "mi-prov";
    prov.textContent = m.provider;
    meta.appendChild(prov);

    if (m.vision) {
      const b = document.createElement("span");
      b.className = "mi-badge vision";
      b.textContent = "视觉";
      meta.appendChild(b);
    }
    if (m.reasoning) {
      const b = document.createElement("span");
      b.className = "mi-badge reasoning";
      b.textContent = "推理";
      meta.appendChild(b);
    }

    item.append(main, meta);
    item.addEventListener("click", () => selectModel(m));
    modelList.appendChild(item);
  });
}

function openModelPop() {
  document.querySelectorAll(".popover").forEach((p) => p.classList.remove("show"));
  modelPop.classList.add("show");
  modelSearch.value = "";
  modelActive = -1;
  renderModelList();
  modelSearch.focus();
  if (!allModels.length) fetchModels().then(renderModelList);
}
function closeModelPop() { modelPop.classList.remove("show"); }

async function selectModel(m) {
  closeModelPop();
  if (m.current) return;
  const r = await api("/api/model", { provider: m.provider, id: m.id });
  notice(r.ok ? `已切换 ${m.provider}/${m.id}` : `切换失败：${r.error}`, r.ok ? 2000 : 4000);
  if (r.ok) { fetchModels(); } // 刷新 current 标记与 currentVision
}

modelPill.addEventListener("click", (e) => {
  e.stopPropagation();
  modelPop.classList.contains("show") ? closeModelPop() : openModelPop();
});
modelSearch.addEventListener("input", () => { modelActive = -1; renderModelList(); });
modelSearch.addEventListener("keydown", (e) => {
  const items = modelList.querySelectorAll(".mi");
  const n = items.length;
  if (e.key === "ArrowDown") { e.preventDefault(); modelActive = (modelActive + 1) % n; }
  else if (e.key === "ArrowUp") { e.preventDefault(); modelActive = (modelActive - 1 + n) % n; }
  else if (e.key === "Enter" && modelActive >= 0) {
    e.preventDefault();
    const q = modelSearch.value.trim().toLowerCase();
    const filtered = allModels.filter((m) => !q || `${m.provider}/${m.id}`.toLowerCase().includes(q));
    if (filtered[modelActive]) selectModel(filtered[modelActive]);
    return;
  } else if (e.key === "Escape") { closeModelPop(); return; }
  else return;
  items.forEach((el, i) => el.classList.toggle("active", i === modelActive));
  items[modelActive]?.scrollIntoView({ block: "nearest" });
});

// thinking 滑块
function setThinkUI(level) {
  const idx = THINK_LEVELS.indexOf(level);
  thinkRange.value = String(idx >= 0 ? idx : 0);
  thinkingEl.textContent = level;
}
thinkRange.addEventListener("change", async () => {
  const level = THINK_LEVELS[Number(thinkRange.value)] || "off";
  await api("/api/thinking", { level });
  notice(`thinking → ${level}`, 1200);
});

// ---- 状态浮层（点徽章切换，点外部关闭） ----
document.querySelectorAll(".stat-pill").forEach((pill) => {
  pill.addEventListener("click", (e) => {
    e.stopPropagation();
    const target = $(pill.dataset.pop);
    const wasOpen = target.classList.contains("show");
    document.querySelectorAll(".popover").forEach((p) => p.classList.remove("show"));
    if (!wasOpen) target.classList.add("show");
  });
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".popover") && !e.target.closest(".stat-pill")) {
    document.querySelectorAll(".popover").forEach((p) => p.classList.remove("show"));
  }
});

// ---- 图片粘贴 / 拖拽 ----
const pendingImages = []; // { mediaType, data }
const imageBar = $("image-bar");
const composerEl = $("composer");
const MAX_IMAGES = 5;

/** 图片预览条警告：当前模型不支持图片时亮起（发送前就提醒，避免“发不出去没反应”） */
function updateImageWarn() {
  imageBar.classList.toggle("warn", pendingImages.length > 0 && !currentVision);
}

function addPendingImage(mediaType, data) {
  if (pendingImages.length >= MAX_IMAGES) { notice(`最多 ${MAX_IMAGES} 张图片`, 2500); return; }
  const img = { mediaType, data };
  pendingImages.push(img);
  const chip = document.createElement("div");
  chip.className = "img-chip";
  const pic = document.createElement("img");
  pic.src = `data:${mediaType};base64,${data}`;
  const rm = document.createElement("button");
  rm.className = "img-rm";
  rm.textContent = "×";
  rm.title = "移除";
  rm.addEventListener("click", () => {
    pendingImages.splice(pendingImages.indexOf(img), 1);
    chip.remove();
    if (!pendingImages.length) imageBar.classList.remove("has");
    updateImageWarn();
  });
  chip.append(pic, rm);
  imageBar.appendChild(chip);
  imageBar.classList.add("has");
  updateImageWarn();
}
function readImageFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const m = String(reader.result).match(/^data:([^;]+);base64,(.+)$/);
    if (m) addPendingImage(m[1], m[2]);
  };
  reader.readAsDataURL(file);
}
// 粘贴（Ctrl+V）
input.addEventListener("paste", (e) => {
  const items = e.clipboardData?.items || [];
  let handled = false;
  for (const item of items) {
    if (item.type && item.type.startsWith("image/")) {
      const file = item.getAsFile();
      if (file) { handled = true; readImageFile(file); }
    }
  }
  if (handled) e.preventDefault();
});
// 拖拽
composerEl.addEventListener("dragover", (e) => {
  if ([...(e.dataTransfer?.types || [])].includes("Files")) {
    e.preventDefault();
    composerEl.classList.add("dragging");
  }
});
composerEl.addEventListener("dragleave", () => composerEl.classList.remove("dragging"));
composerEl.addEventListener("drop", (e) => {
  e.preventDefault();
  composerEl.classList.remove("dragging");
  for (const file of e.dataTransfer?.files || []) {
    if (file.type.startsWith("image/")) readImageFile(file);
  }
});

// ---- 斜杠命令补全 ----
const cmdPanel = $("cmd-panel");
let allCommands = []; // {name, description, source}
let cmdActive = -1;
let cmdFiltered = [];

async function fetchCommands() {
  try {
    const { commands } = await api("/api/commands");
    allCommands = Array.isArray(commands) ? commands : [];
  } catch { allCommands = []; }
}

function updateCmdPanel() {
  const v = input.value;
  // 光标在首行且以 / 开头（无空格）才触发
  if (!v.startsWith("/") || v.includes("\n") || v.includes(" ")) {
    hideCmdPanel();
    return;
  }
  const q = v.slice(1).toLowerCase();
  cmdFiltered = allCommands.filter((c) => c.name.toLowerCase().includes(q));
  if (!cmdFiltered.length) {
    cmdPanel.innerHTML = `<div class="cmd-none">无匹配命令</div>`;
    cmdPanel.classList.add("show");
    cmdActive = -1;
    return;
  }
  cmdPanel.innerHTML = "";
  cmdFiltered.slice(0, 30).forEach((c, i) => {
    const item = document.createElement("div");
    item.className = "cmd-item" + (i === cmdActive ? " active" : "");
    const name = document.createElement("span");
    name.className = "c-name";
    name.textContent = "/" + c.name;
    const desc = document.createElement("span");
    desc.className = "c-desc";
    desc.textContent = c.description || "";
    const src = document.createElement("span");
    src.className = "c-src";
    src.textContent = { extension: "扩展", prompt: "模板", skill: "skill" }[c.source] || c.source;
    item.append(name, desc, src);
    item.addEventListener("mousedown", (e) => {
      e.preventDefault(); // 防 textarea 失焦
      applyCommand(i);
    });
    cmdPanel.appendChild(item);
  });
  cmdPanel.classList.add("show");
}

function hideCmdPanel() {
  cmdPanel.classList.remove("show");
  cmdPanel.innerHTML = ""; // 清空内容双保险（无样式残留也不会占位）
  cmdActive = -1;
}

function applyCommand(i) {
  const c = cmdFiltered[i];
  if (!c) return;
  input.value = "/" + c.name + " ";
  hideCmdPanel();
  input.focus();
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
}

function moveCmdActive(delta) {
  const n = Math.min(cmdFiltered.length, 30);
  if (!n) return;
  cmdActive = (cmdActive + delta + n) % n;
  cmdPanel.querySelectorAll(".cmd-item").forEach((el, i) => el.classList.toggle("active", i === cmdActive));
  cmdPanel.querySelectorAll(".cmd-item")[cmdActive]?.scrollIntoView({ block: "nearest" });
}

input.addEventListener("input", updateCmdPanel);

// ---- 输入 ----
input.addEventListener("keydown", (e) => {
  // 命令补全面板键盘导航
  if (cmdPanel.classList.contains("show")) {
    if (e.key === "ArrowDown") { e.preventDefault(); moveCmdActive(1); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); moveCmdActive(-1); return; }
    if (e.key === "Tab" || (e.key === "Enter" && cmdActive >= 0)) {
      e.preventDefault();
      applyCommand(cmdActive >= 0 ? cmdActive : 0);
      return;
    }
    if (e.key === "Escape") { hideCmdPanel(); return; }
  }
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
  if (e.key === "Escape" && abortBtn && !abortBtn.disabled) {
    api("/api/abort").then(() => notice("已发送中止", 1500));
  }
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
});
sendBtn.addEventListener("click", send);
abortBtn.addEventListener("click", () => api("/api/abort").then(() => notice("已发送中止", 1500)));

async function send() {
  const text = input.value.trim();
  if (!text && !pendingImages.length) return;
  input.value = "";
  input.style.height = "auto";
  const deliverAs = undefined; // 永远自动：空闲直发，运行中自动 steer
  const images = pendingImages.length
    ? pendingImages.map((i) => ({ mediaType: i.mediaType, data: i.data }))
    : undefined;
  sendBtn.disabled = true;
  // 当前模型不支持图片：发送前就明确提示（避免发到后端才报错、还白白恢复文本）
  if (images?.length && !currentVision) {
    sendBtn.disabled = false;
    imageBar.classList.add("warn");
    notice("当前模型不支持上传图片，请切换到视觉模型（如 anthropic/openai 系列）", 5000);
    input.focus();
    return;
  }
  // 渲染依赖服务端广播：sendUserMessage 注入会话后 message_start 事件实时推回
  try {
    const r = await api("/api/message", { text, deliverAs, images });
    if (!r.ok) throw new Error(r.error);
    // 发送成功才清空预览
    pendingImages.length = 0;
    imageBar.innerHTML = "";
    imageBar.classList.remove("has", "warn");
  } catch (e) {
    notice(`发送失败：${e.message}`, 4000);
    input.value = text;
    updateImageWarn();
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

// ---- SSE 事件 ----
function connectSSE() {
  const es = new EventSource(`${S}/events?token=${encodeURIComponent(token)}`);
  es.onopen = () => {
    setConn("连接中…");
    api("/api/state").then(({ snapshot }) => updateState(snapshot)).catch(() => setConn("已连接"));
    loadHistory().catch(() => {});
  };
  es.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    onEvent(msg);
  };
  es.onerror = () => {
    setConn("断开，重连中…（若会话已退出请返回列表页）");
    connPill.className = "pill";
    connPill.querySelector(".dot").style.background = "var(--danger)";
  };
}

function onEvent(msg) {
  switch (msg.type) {
    case "session_start":
      setBusy(false);
      updateState(msg.snapshot);
      loadHistory().catch(() => {});
      // fork 回退完成：把暂存的原文填入输入框
      if (msg.reason === "fork" && pendingForkText !== null) {
        input.value = pendingForkText;
        pendingForkText = null;
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 180) + "px";
        input.focus();
        notice("已回退，原文已填入输入框", 2500);
      }
      break;
    case "session_tree":
    case "session_compact":
      // TUI 侧 /tree 回退或压缩：消息集已变，全量重建
      loadHistory().catch(() => {});
      break;
    case "snapshot":
      updateState(msg.snapshot);
      break;
    case "message_start": {
      const m = msg.message;
      if (!m) break;
      if (m.role === "user") {
        empty.style.display = "none";
        addUserMsg(contentText(m.content), contentImages(m.content));
      } else if (m.role === "assistant") {
        empty.style.display = "none";
        newAssistantMsg();
      }
      break;
    }
    case "message_update": {
      const evt = msg.event;
      if (!evt) break;
      if (evt.type === "text_delta") appendStreamText(evt.delta || "");
      else if (evt.type === "thinking_delta") appendThinkingDelta(evt.delta || "");
      else if (evt.type === "thinking_start") appendThinkingDelta("");
      break;
    }
    case "message_end": {
      const m = msg.message;
      if (!m) break;
      // 绑定 entryId（回退锚点）：assistant 绑到流式卡片，user 绑到最近用户卡片
      if (m.role === "assistant") {
        finishAssistantMsg(m, false, msg.entryId || null);
      } else if (m.role === "user" && lastUserCard && msg.entryId) {
        lastUserCard.dataset.entryId = msg.entryId;
      }
      break;
    }
    case "tool_start":
      empty.style.display = "none";
      addToolCard(msg.toolCallId, msg.toolName, msg.args);
      break;
    case "tool_end":
      finishToolCard(msg.toolCallId, !!msg.isError, msg.result);
      break;
    case "agent_start":
      setBusy(true);
      break;
    case "agent_settled":
      setBusy(false);
      break;
    case "model_select":
      if (msg.model) {
        modelEl.textContent = `${msg.model.provider}/${msg.model.id}`;
        notice(`模型 → ${msg.model.id}`, 1500);
        // 模型可能被 TUI 侧切换：刷新 current 标记与 currentVision（图片预览警告随之更新）
        fetchModels().catch(() => {});
      }
      break;
    case "thinking_select":
      setThinkUI(msg.level);
      break;
    case "session_info_changed":
      sessionName.textContent = msg.name || sessionName.textContent;
      break;
  }
}

// ---- 会话列表视图 ----
function fmtAgo(ts) {
  const d = Date.now() - ts;
  if (d < 60_000) return "刚刚";
  if (d < 3600_000) return `${Math.floor(d / 60_000)} 分钟前`;
  return `${Math.floor(d / 3600_000)} 小时前`;
}
async function renderSessionList() {
  const box = $("session-cards");
  try {
    const { sessions } = await fetch(`/api/sessions?token=${encodeURIComponent(token)}`).then((r) => r.json());
    if (!sessions || !sessions.length) {
      box.innerHTML = '<div class="none">暂无活跃会话<br>在任意 pi TUI 会话中会自动注册到本列表</div>';
      return;
    }
    box.innerHTML = "";
    for (const s of sessions) {
      const a = document.createElement("a");
      a.className = "scard";
      a.href = `/s/${s.pid}/?token=${encodeURIComponent(token)}`;
      const pidEl = document.createElement("span");
      pidEl.className = "sc-pid";
      pidEl.textContent = s.local ? `${s.pid} · 主` : String(s.pid);
      const info = document.createElement("div");
      info.className = "sc-info";
      const name = document.createElement("div");
      name.className = "sc-name";
      name.textContent = s.sessionName || "(未命名会话)";
      const cwd = document.createElement("div");
      cwd.className = "sc-cwd";
      cwd.textContent = s.cwd;
      info.append(name, cwd);
      const time = document.createElement("span");
      time.className = "sc-time";
      time.textContent = fmtAgo(s.startedAt);
      a.append(pidEl, info, time);
      box.appendChild(a);
    }
  } catch (e) {
    box.innerHTML = `<div class="none">加载会话列表失败：${escapeHtml(e.message || String(e))}<br>检查 token 是否有效</div>`;
  }
}

// ---- 启动 ----
if (!token) {
  if (sessionPid) {
    empty.innerHTML = '<div class="big">未找到访问凭据</div>请在 TUI 中运行 <b>/webui</b> 查看带 token 的访问地址';
    setConn("无凭据");
    connPill.className = "pill";
  } else {
    $("session-cards").innerHTML = '<div class="none">未找到访问凭据<br>请在 TUI 中运行 <b>/webui</b> 查看带 token 的访问地址</div>';
  }
} else if (sessionPid) {
  $("back-list").href = `/?token=${encodeURIComponent(token)}`;
  connectSSE();
  fetchCommands();
  fetchModels();
  input.focus();
} else {
  renderSessionList();
  setInterval(renderSessionList, 5000); // 列表页 5s 轮询
}
